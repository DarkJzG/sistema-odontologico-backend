# src/main/resources/application.properties

server.port=8081

spring.application.name=gestion-citas

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/odontologia_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Keycloak
keycloak.server-url=http://localhost:8080
keycloak.realm=odontostyle-realm
keycloak.client-id=admin-cli
keycloak.username=admin
keycloak.password=admin

# Configuración de OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/odontostyle-realm